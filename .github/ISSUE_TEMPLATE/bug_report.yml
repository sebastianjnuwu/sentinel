name: Bug report
description: Report a reproducible bug in Sentinel
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please search existing issues first.
        For security vulnerabilities, do **not** open a public issue — use
        [private vulnerability reporting](https://github.com/sebastianjnuwu/sentinel/security/advisories/new).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal project files and exact commands.
      placeholder: |
        1. Create a project with ...
        2. Run `sentinel --json .`
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sentinel version
      description: Output of `sentinel --version`
      placeholder: sentinel 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: ecosystem
    attributes:
      label: Ecosystem / lockfile
      placeholder: npm, pnpm, yarn, Cargo, Go, Maven, Gradle, ...
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Command output, JSON or SARIF snippet. Remove secrets first.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I removed tokens, credentials and private paths from the output
          required: true
        - label: I am using the latest release
          required: true
