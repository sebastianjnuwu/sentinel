name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: sentinel-linux-amd64
            ext: tar.gz
          - os: macos-15
            asset: sentinel-macos-arm64
            ext: tar.gz
          - os: windows-2025
            asset: sentinel-windows-amd64
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.asset }}.tar.gz" -C target/release sentinel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/sentinel.exe -DestinationPath "${{ matrix.asset }}.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: "${{ matrix.asset }}.${{ matrix.ext }}"
