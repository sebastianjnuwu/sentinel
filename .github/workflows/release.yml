name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: sentinel-linux-amd64
            ext: tar.gz
            use_cross: true
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            asset: sentinel-linux-arm64
            ext: tar.gz
            use_cross: true
          - os: ubuntu-24.04
            target: i686-unknown-linux-musl
            asset: sentinel-linux-386
            ext: tar.gz
            use_cross: true
          - os: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
            asset: sentinel-linux-armv7
            ext: tar.gz
            use_cross: true
          - os: macos-15
            target: aarch64-apple-darwin
            asset: sentinel-macos-arm64
            ext: tar.gz
            use_cross: false
          - os: macos-15
            target: x86_64-apple-darwin
            asset: sentinel-macos-amd64
            ext: tar.gz
            use_cross: false
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: sentinel-windows-amd64
            ext: zip
            use_cross: false
          - os: windows-2025
            target: aarch64-pc-windows-msvc
            asset: sentinel-windows-arm64
            ext: zip
            use_cross: false
          - os: windows-2025
            target: i686-pc-windows-msvc
            asset: sentinel-windows-386
            ext: zip
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.asset }}.tar.gz" -C "target/${{ matrix.target }}/release" sentinel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/sentinel.exe" -DestinationPath "${{ matrix.asset }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: "${{ matrix.asset }}.${{ matrix.ext }}"

  publish-release:
    name: Publish GitHub Release & Checksums
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS (checksums.txt)
        run: |
          cd dist
          sha256sum sentinel-* | tee checksums.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/sentinel-*
            dist/checksums.txt

  publish-ghcr:
    name: Publish Multi-Arch GHCR Package (scratch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sebastianjnuwu/sentinel:latest
            ghcr.io/sebastianjnuwu/sentinel:${{ inputs.tag || github.ref_name }}
