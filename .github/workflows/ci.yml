name: CI

on:
  workflow_dispatch:
  push:
    branches: [production]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Format, Clippy, Line Limit & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Check 70-line file limit
        run: |
          failed=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 70 ]; then
              echo "::error file=$file::File has $lines lines (max 70 allowed)"
              failed=1
            fi
          done < <(find src -name '*.rs')
          exit $failed

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  build:
    name: Build (${{ matrix.os }})
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

  security-scan:
    name: Sentinel Security Scan
    needs: lint-and-test
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Sentinel
        run: cargo build --release

      - name: Run Sentinel Security Scan
        run: ./target/release/sentinel --sarif --fail-on-cve . > sentinel.sarif

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.39.4
        with:
          sarif_file: sentinel.sarif
